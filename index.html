<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts"></div>

    <div class="birthday-card">

        <h1>Happy Birthday MAMA! 🎂</h1>

        <p class="message">
            Wishing you a wonderful birthday filled with
            happiness, love, and beautiful memories.
        </p>
        <p id="secret">
            💗 You deserve all the happiness in the world! 💗
        </p>
        
        <div class="gallery" id="gallery">

            <div class="photo" onclick="enlargePicture(this)">
                <img src="photo1.jpg">
            </div>

            <div class="photo active" onclick="enlargePicture(this)">
                <img src="photo2.jpg">
            </div>

            <div class="photo" onclick="enlargePicture(this)">
                <img src="photo3.jpg">
            </div>

            <div class="photo" onclick="enlargePicture(this)">
                <img src="photo4.jpg">
            </div>

            <p id="pictureMessage">
                Pindutin mo yung mga picture ma para lumaki!!!
            </p>

        </div>

        <audio id="birthdaySong">
            <source src="birthday-song.mp3" type="audio/mpeg">
        </audio>

  <div id="thirdScreen">
    

    <div class="envelope">
        <div class="envelope-flap"></div>

        <div class="letter">
            💗
        </div>

        <div class="envelope-body"></div>

        <div class="seal" onclick="showFourthScreen()">♥</div>
    </div>

    <div class="for-mama">
        PINDUTIN MO YUNG HEART MA!!! 💗
    </div>

</div>


<div id="fourthScreen">

    <div id="countdown">5</div>

    <div class="cake">

        <div class="candle candle1">
            <div class="flame">🔥</div>
        </div>

        <div class="candle candle2">
            <div class="flame">🔥</div>
        </div>

        <div class="candle candle3">
            <div class="flame">🔥</div>
        </div>

        <div class="cake-top">
            <span>♥</span>
            <span>♥</span>
            <span>♥</span>
        </div>

        <div class="cake-middle">
            <div class="icing">🍓 🍓 🍓</div>
        </div>

        <div class="cake-bottom">
            <div class="cake-decoration">♥ ♥ ♥ ♥ ♥</div>
        </div>

    </div>
    <div id="heartConfetti"></div>

    <div id="cakeLetter">
        <div class="letter-paper">
            💌
            <p id="letterText"></p>
        </div>
    </div>

    <audio id="cakeSound">
        <source src="cake-sound.mp3" type="audio/mpeg">
    </audio>

</div>


<button onclick="showPictures()">
    Click Me 💗
</button>

        

        

    </div>

    <script src="script.js"></script>

</body>
</html>
